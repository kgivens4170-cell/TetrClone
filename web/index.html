<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TetrClone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: menu and stats scroll; the game screen is one fixed screen (HUD, stats, board, thumb pad).
   Colors are tokens that the chosen skin overrides at runtime. Dark Classic is the default. */
:root {
  --bg: #0d1017; --well: #070a10; --grid: #161b26; --fg: #e6ebf5; --dim: #8791a6;
  --key: #1b2230; --keyhot: #2a3550; --line: #263048; --accent: #ffcf4a; --danger: #ff4d5e;
  --font: "Chakra Petch", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
body { margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
}
button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.screen { height: 100%; overflow-y: auto; }
.page { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px; }

/* menu */
.logo { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.logo h1 { margin: 0; font-size: 34px; letter-spacing: .12em; font-weight: 700; }
.logo .blocks { display: flex; gap: 4px; }
.logo .blocks i { width: 14px; height: 14px; border-radius: 2px; display: block; }
.logo p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
.modes { display: flex; flex-direction: column; gap: 8px; }
.mode { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 64px;
  background: var(--key); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.mode:active { background: var(--keyhot); }
.mtxt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mtxt b { font-size: 17px; letter-spacing: .03em; }
.mtxt .date { font-size: 11px; color: var(--dim); font-weight: 500; margin-left: 6px; }
.mtxt i { font-style: normal; font-size: 12px; color: var(--dim); }
.mbest { display: flex; flex-direction: column; align-items: flex-end; font-size: 16px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; flex: none; }
.mbest small { font-size: 9px; letter-spacing: .14em; color: var(--dim); font-weight: 600; }
.seg { display: flex; gap: 6px; margin: -2px 0 2px; }
.seg button { flex: 1; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 600; color: var(--dim); }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.row2 { display: flex; gap: 8px; }
.btn { flex: 1; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--key); font-size: 15px; font-weight: 600; cursor: pointer; padding: 0 14px; }
.btn:active { background: var(--keyhot); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn small { color: var(--dim); font-weight: 500; margin-left: 6px; }

/* sub screens */
.top { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
.top h2 { margin: 0; font-size: 22px; letter-spacing: .06em; }
.back { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--key); font-size: 20px; cursor: pointer; }
h3 { margin: 6px 0 0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv { display: flex; flex-direction: column; gap: 2px; background: var(--key); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.kv span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.kv b { font-size: 18px; font-variant-numeric: tabular-nums; }
.kv b small { font-size: 10px; color: var(--dim); font-weight: 500; }
.hrow { display: grid; grid-template-columns: 62px 1fr auto 40px; gap: 8px; align-items: center; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.hm { color: var(--dim); }
.hbar { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.hbar i { display: block; height: 100%; background: var(--accent); }
.hv { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.hd { color: var(--dim); font-size: 11px; text-align: right; }
.empty { color: var(--dim); font-size: 13px; margin: 4px 0; }
.trophy { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; opacity: .55; }
.trophy.got { opacity: 1; background: var(--key); }
.trophy .tmark { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
.trophy.got .tmark { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.trophy span:last-child { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.trophy b { font-size: 14px; } .trophy i { font-style: normal; font-size: 12px; color: var(--dim); }
.set { display: flex; flex-direction: column; gap: 6px; }
.set label { display: flex; justify-content: space-between; font-size: 14px; }
.set input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.toggle { display: flex; justify-content: space-between; align-items: center; font-size: 15px; min-height: 40px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.skins { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.skin { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--key); cursor: pointer; }
.skin.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.skin:disabled { opacity: .5; cursor: default; }
.skin small { font-size: 11px; color: var(--dim); }
.sw { display: flex; gap: 3px; padding: 5px; border: 1px solid; border-radius: 6px; }
.sw i { width: 14px; height: 14px; display: block; border-radius: 2px; }

/* game */
.game { display: flex; flex-direction: column; gap: 8px; max-width: 520px; margin: 0 auto; overflow: hidden; }
.game[hidden] { display: none; }
.hud { display: flex; align-items: center; gap: 10px; }
.hud canvas { border: 1px solid var(--line); border-radius: 6px; flex: none; }
.hudmid { flex: 1; min-width: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); text-align: center; }
.statrow { display: flex; gap: 14px; align-items: flex-end; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat span { font-size: 10px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat.score { flex: 1; } .stat.score b { color: var(--accent); }
#stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; gap: 10px; position: relative; }
#board, #opp { display: block; border: 1px solid var(--line); border-radius: 4px; background: var(--well); }
#oppCol { display: flex; flex-direction: column; gap: 6px; align-self: flex-start; }
#oppInfo { display: flex; flex-direction: column; gap: 1px; font-size: 11px; color: var(--dim); line-height: 1.3; }
#oppInfo b { color: var(--fg); font-size: 12px; }
#ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.62); border-radius: 4px; z-index: 5; overflow-y: auto; }
.panel { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: min(100%, 340px); display: flex; flex-direction: column; gap: 12px; margin: auto; }
.panel h2 { margin: 0; font-size: 24px; letter-spacing: .08em; text-align: center; text-transform: uppercase; }
.big { font-size: 38px; font-weight: 700; text-align: center; color: var(--accent); font-variant-numeric: tabular-nums; }
.big small { display: block; font-size: 11px; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; font-weight: 500; }
.badge { align-self: center; background: var(--accent); color: var(--bg); font-weight: 700; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
.note { margin: 0; text-align: center; font-size: 13px; color: var(--dim); }
.btns { display: flex; flex-direction: column; gap: 8px; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pad button { font: 700 20px var(--font); background: var(--key); border: 1px solid var(--line); border-radius: 10px; height: 52px; touch-action: none; -webkit-tap-highlight-color: transparent; }
.pad button.on, .pad button:active { background: var(--keyhot); }
.pad .hard { grid-column: span 2; color: var(--accent); letter-spacing: .1em; font-size: 16px; }
.pad .lbl { font-size: 14px; letter-spacing: .08em; }
.meta { display: flex; justify-content: space-between; }
.meta button { background: none; border: 0; color: var(--dim); font-size: 12px; text-decoration: underline; padding: 4px 2px; min-height: 28px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); background: var(--accent); color: var(--bg); font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 999px; z-index: 20; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<section id="screen-menu" class="screen">
  <div class="page">
    <div class="logo">
      <h1>TETRCLONE</h1>
      <div class="blocks"><i style="background:#2fe6e6"></i><i style="background:#f2e233"></i><i style="background:#a64ef0"></i><i style="background:#3ee05a"></i><i style="background:#f04a4a"></i><i style="background:#4a6cf5"></i><i style="background:#f5a03a"></i></div>
      <p>SRS rotation, hold, T-spins, combos and a bot that fights back.</p>
    </div>
    <div id="modes" class="modes"></div>
    <div class="row2">
      <button class="btn" id="goStats">Stats and trophies <small id="trophyCount"></small></button>
      <button class="btn" id="goSettings">Settings</button>
    </div>
  </div>
</section>

<section id="screen-stats" class="screen" hidden>
  <div class="page">
    <div class="top"><button class="back" id="backStats" aria-label="Back">&#8592;</button><h2>Stats</h2></div>
    <h3>Totals</h3><div id="statsGrid"></div>
    <h3>Personal bests</h3><div id="bestGrid"></div>
    <h3>Recent games</h3><div id="history"></div>
    <h3>Trophies</h3><div id="trophies" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>
</section>

<section id="screen-settings" class="screen" hidden>
  <div class="page">
    <div class="top"><button class="back" id="backSettings" aria-label="Back">&#8592;</button><h2>Settings</h2></div>
    <h3>Handling</h3>
    <div class="set"><label for="das">Delay before auto-repeat <span id="dasV"></span></label><input type="range" id="das" min="60" max="300" step="10"></div>
    <div class="set"><label for="arr">Auto-repeat speed (lower is faster) <span id="arrV"></span></label><input type="range" id="arr" min="0" max="100" step="5"></div>
    <h3>Options</h3>
    <label class="toggle">Ghost piece <input type="checkbox" id="optGhost"></label>
    <label class="toggle">Sound effects <input type="checkbox" id="optSound"></label>
    <label class="toggle">Vibration <input type="checkbox" id="optVib"></label>
    <h3>Themes</h3><div id="skins" class="skins"></div>
    <h3>Data</h3>
    <button class="btn" id="resetBtn">Erase all progress</button>
    <p class="empty">Progress is saved in this browser only.</p>
  </div>
</section>

<section id="screen-game" class="screen game" hidden>
  <div class="hud">
    <canvas id="holdC" aria-label="Held piece"></canvas>
    <div class="hudmid" id="modeName"></div>
    <canvas id="nextC" aria-label="Next pieces"></canvas>
  </div>
  <div class="statrow">
    <div class="stat score"><span>Score</span><b id="vScore">0</b></div>
    <div class="stat"><span>Lines</span><b id="vLines">0</b></div>
    <div class="stat"><span>Level</span><b id="vLevel">1</b></div>
    <div class="stat"><span id="lblTime">Time</span><b id="vTime">0:00</b></div>
  </div>
  <div id="stage">
    <canvas id="board" aria-label="Playfield"></canvas>
    <div id="oppCol" hidden><div id="oppInfo"></div><canvas id="opp" aria-label="Opponent playfield"></canvas></div>
    <div id="ov" hidden></div>
  </div>
  <div class="pad">
    <button id="bHold" class="lbl" aria-label="Hold">HOLD</button>
    <button id="bLeft" aria-label="Move left">&#9664;</button>
    <button id="bRight" aria-label="Move right">&#9654;</button>
    <button id="bCW" aria-label="Rotate clockwise">&#8635;</button>
    <button id="bCCW" aria-label="Rotate counter-clockwise">&#8634;</button>
    <button id="bSoft" aria-label="Soft drop">&#9660;</button>
    <button id="bHard" class="hard" aria-label="Hard drop">DROP</button>
  </div>
  <div class="meta"><button id="pauseBtn">Pause</button><button id="quitBtn">Quit to menu</button></div>
</section>

<div id="toast" hidden></div>

<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
