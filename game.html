<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Elemental Break</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07070d; --ink: #ebebf5; --muted: #8c8ca8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Press Start 2P", ui-monospace, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px; min-height: 100vh;
    touch-action: none; user-select: none;
  }
  h1 { font-size: 14px; margin: 0; letter-spacing: 1px; }
  #hint { font-size: 8px; color: var(--muted); margin: 0; text-align: center; line-height: 1.8; }
  #wrap { width: min(100%, 576px); }
  canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 192 / 240;
    background: var(--bg); image-rendering: pixelated; image-rendering: crisp-edges;
    border: 3px solid #26263d; cursor: none;
  }
</style>
</head>
<body>

<h1>ELEMENTAL BREAK</h1>
<div id="wrap"><canvas id="c" width="192" height="240"></canvas></div>
<p id="hint">MOVE: MOUSE / TOUCH / ← → &nbsp; LAUNCH: CLICK / SPACE<br>
THE BALL SHIFTS COLOR WITH EVERY BOUNCE</p>

<script src="brick-palettes.js"></script>
<script>
(function () {
  'use strict';

  var BP = window.BrickPalettes;
  var PAL = BP.PALETTES;
  var BW = BP.W, BH = BP.H;

  var LW = 192, LH = 240;               // logical resolution
  var COLS = 11, ROWS = 5;
  var BRICK_X0 = 2, BRICK_Y0 = 30, GAP_X = 1, GAP_Y = 1;

  var PADDLE_W = 32, PADDLE_H = 4, PADDLE_Y = LH - 14;
  var PADDLE_COLOR = { face: '#8d8fa0', hi: '#c8cad6', lo: '#4c4e5c', edge: '#22232b' };
  var BASE_SPEED = 96;                  // logical px per second
  var BALL_R = 2;

  // Ball colour climbs through these stops as it bounces.
  var BOUNCE_STOPS = ['#ffffff', '#ffe27a', '#ff9a2a', '#ff3a6d', '#c040ff'];
  var BOUNCE_FULL = 60;                 // bounces to reach the last stop

  var cv = document.getElementById('c');
  var g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;

  var state, bricks, ball, paddle, lives, score, time, particles, keys, pointerX;

  function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }

  function ballColor(bounces) {
    var t = Math.min(bounces / BOUNCE_FULL, 1) * (BOUNCE_STOPS.length - 1);
    var i = Math.min(Math.floor(t), BOUNCE_STOPS.length - 2);
    var f = t - i;
    var a = hexToRgb(BOUNCE_STOPS[i]), b = hexToRgb(BOUNCE_STOPS[i + 1]);
    var r = Math.round(a[0] + (b[0] - a[0]) * f);
    var gg = Math.round(a[1] + (b[1] - a[1]) * f);
    var bb = Math.round(a[2] + (b[2] - a[2]) * f);
    return 'rgb(' + r + ',' + gg + ',' + bb + ')';
  }

  function newBall() {
    return { x: paddle.x + PADDLE_W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, bounces: 0 };
  }

  function reset(full) {
    paddle = { x: LW / 2 - PADDLE_W / 2, w: PADDLE_W, h: PADDLE_H, y: PADDLE_Y, vx: 0 };
    ball = newBall();
    particles = [];
    state = 'ready';
    if (full) {
      lives = 3;
      score = 0;
      bricks = [];
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          bricks.push({
            x: BRICK_X0 + c * (BW + GAP_X),
            y: BRICK_Y0 + r * (BH + GAP_Y),
            alive: true,
            pal: PAL[(r + c) % PAL.length],
            seed: r * COLS + c
          });
        }
      }
    }
  }

  function launch() {
    if (state !== 'ready') return;
    var ang = (Math.random() * 0.6 - 0.3);            // slight random start angle
    ball.vx = Math.sin(ang) * BASE_SPEED;
    ball.vy = -Math.cos(ang) * BASE_SPEED;
    state = 'play';
  }

  function bounce(opts) {
    ball.bounces++;
    if (opts && opts.spawn) spawnDebris(opts.x, opts.y, opts.color);
  }

  function spawnDebris(x, y, color) {
    for (var i = 0; i < 6; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 80,
        vy: (Math.random() - 0.7) * 80,
        life: 0.5 + Math.random() * 0.3,
        color: color
      });
    }
  }

  function step(dt) {
    time += dt;
    // Paddle from keyboard
    var dir = (keys.ArrowLeft ? -1 : 0) + (keys.ArrowRight ? 1 : 0);
    if (dir !== 0) paddle.x += dir * 140 * dt;
    if (pointerX !== null) paddle.x = pointerX - PADDLE_W / 2;
    paddle.x = Math.max(0, Math.min(LW - PADDLE_W, paddle.x));

    // Particles
    for (var p = particles.length - 1; p >= 0; p--) {
      var q = particles[p];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 200 * dt; q.life -= dt;
      if (q.life <= 0) particles.splice(p, 1);
    }

    if (state === 'ready') {
      ball.x = paddle.x + PADDLE_W / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
      return;
    }
    if (state !== 'play') return;

    var dist = BASE_SPEED * dt;
    var n = Math.max(1, Math.ceil(dist / 0.5));
    var sub = dt / n;
    for (var i = 0; i < n; i++) {
      var px = ball.x, py = ball.y;
      ball.x += ball.vx * sub;
      ball.y += ball.vy * sub;
      collide(px, py);
      if (state !== 'play') return;
    }
  }

  function collide(px, py) {
    var r = BALL_R;

    // Walls
    if (ball.x - r < 0) { ball.x = r; ball.vx = Math.abs(ball.vx); bounce(); }
    if (ball.x + r > LW) { ball.x = LW - r; ball.vx = -Math.abs(ball.vx); bounce(); }
    if (ball.y - r < 0) { ball.y = r; ball.vy = Math.abs(ball.vy); bounce(); }

    // Paddle: only when moving down and crossing its top edge
    if (ball.vy > 0 &&
        ball.y + r >= paddle.y && py + r <= paddle.y + 1 &&
        ball.x >= paddle.x - r && ball.x <= paddle.x + PADDLE_W + r) {
      var hit = (ball.x - (paddle.x + PADDLE_W / 2)) / (PADDLE_W / 2);
      hit = Math.max(-1, Math.min(1, hit));
      var ang = hit * 1.0;                              // up to ~57 degrees
      var speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(ang) * speed;
      ball.vy = -Math.cos(ang) * speed;
      ball.y = paddle.y - r;
      bounce({ spawn: false });
    }

    // Bricks
    for (var b = 0; b < bricks.length; b++) {
      var k = bricks[b];
      if (!k.alive) continue;
      var cx = Math.max(k.x, Math.min(ball.x, k.x + BW));
      var cy = Math.max(k.y, Math.min(ball.y, k.y + BH));
      var dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > r * r) continue;

      k.alive = false;
      score += 10;
      // Reflect on the axis we entered through
      var wasInX = px + r > k.x && px - r < k.x + BW;
      if (wasInX) ball.vy = -ball.vy; else ball.vx = -ball.vx;
      // Push the ball out so it cannot re-hit next substep
      if (wasInX) ball.y = py;
      else ball.x = px;
      spawnDebris(k.x + BW / 2, k.y + BH / 2, k.pal.tones[2]);
      bounce();
      break;
    }

    if (bricks.every(function (k) { return !k.alive; })) {
      state = 'won';
      return;
    }

    // Floor: lose a life
    if (ball.y - r > LH) {
      lives--;
      if (lives <= 0) { state = 'over'; return; }
      reset(false);
    }
  }

  function draw() {
    g.fillStyle = '#07070d';
    g.fillRect(0, 0, LW, LH);

    // Bricks
    for (var b = 0; b < bricks.length; b++) {
      var k = bricks[b];
      if (k.alive) BP.drawBrick(g, k.pal, k.x, k.y, 1, k.seed, time);
    }

    // Debris
    for (var p = 0; p < particles.length; p++) {
      var q = particles[p];
      g.fillStyle = q.color;
      g.fillRect(Math.round(q.x), Math.round(q.y), 1, 1);
    }

    // Paddle: grey pixel bevel
    var x = Math.round(paddle.x), y = paddle.y;
    g.fillStyle = PADDLE_COLOR.edge; g.fillRect(x, y, PADDLE_W, PADDLE_H);
    g.fillStyle = PADDLE_COLOR.face; g.fillRect(x + 1, y + 1, PADDLE_W - 2, PADDLE_H - 2);
    g.fillStyle = PADDLE_COLOR.hi;   g.fillRect(x + 1, y + 1, PADDLE_W - 2, 1);
    g.fillStyle = PADDLE_COLOR.lo;   g.fillRect(x + 1, y + PADDLE_H - 2, PADDLE_W - 2, 1);

    // Ball: 4x4 pixel blob, corners cut, colour from bounce count
    var col = ballColor(ball.bounces);
    var bx = Math.round(ball.x - 2), by = Math.round(ball.y - 2);
    g.fillStyle = col;
    g.fillRect(bx + 1, by, 2, 4);
    g.fillRect(bx, by + 1, 4, 2);

    // HUD
    g.fillStyle = '#8c8ca8';
    g.font = '8px monospace';
    g.textBaseline = 'top';
    g.fillText('SCORE ' + score, 4, 4);
    g.textAlign = 'right';
    g.fillText('LIVES ' + lives, LW - 4, 4);
    g.textAlign = 'left';
    g.fillStyle = col;
    g.fillText('BOUNCES ' + ball.bounces, 4, 14);

    // Overlays
    g.textAlign = 'center';
    g.fillStyle = '#ebebf5';
    if (state === 'ready') g.fillText('CLICK / SPACE', LW / 2, 150);
    if (state === 'over') g.fillText('GAME OVER', LW / 2, 150);
    if (state === 'won') g.fillText('CLEARED', LW / 2, 150);
    g.textAlign = 'left';
  }

  function restartIfEnded() {
    if (state === 'over' || state === 'won') reset(true);
  }

  // Input
  keys = {};
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { keys[e.key] = true; e.preventDefault(); }
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'ready') launch(); else restartIfEnded();
    }
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  function toLogicalX(clientX) {
    var rect = cv.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * LW;
  }

  pointerX = null;
  cv.addEventListener('pointermove', function (e) { pointerX = toLogicalX(e.clientX); });
  cv.addEventListener('pointerleave', function () { pointerX = null; });
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    pointerX = toLogicalX(e.clientX);
    if (state === 'ready') launch(); else restartIfEnded();
  });

  // Loop
  reset(true);
  time = 0;
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    step(dt);
    draw();
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
