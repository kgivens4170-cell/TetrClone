<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Elemental Break 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07070d; --ink: #ebebf5; --muted: #8c8ca8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Press Start 2P", ui-monospace, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 16px; min-height: 100vh;
    touch-action: none; user-select: none;
  }
  h1 { font-size: 14px; margin: 0; letter-spacing: 1px; }
  #hint { font-size: 8px; color: var(--muted); margin: 0; text-align: center; line-height: 1.8; }
  #wrap { width: min(100%, 576px); }
  canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 192 / 180;
    background: var(--bg); image-rendering: pixelated; image-rendering: crisp-edges;
    border: 3px solid #26263d; cursor: none;
  }

  /* Touch pad under the playfield */
  #pad { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  #drag {
    height: clamp(110px, 34vh, 220px); border: 3px solid #26263d; background: #0c0c15;
    background-image: radial-gradient(#1c1c2c 1px, transparent 1px);
    background-size: 12px 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--muted); text-align: center; line-height: 1.8;
    touch-action: none;
  }
  #btns { display: grid; grid-template-columns: repeat(4, 1fr) 1.8fr; gap: 8px; }
  #btns button {
    font-family: inherit; font-size: 12px; height: 52px; color: var(--ink);
    background: #13131f; border: 3px solid #26263d; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #btns button.pressed, #btns button:active { background: #26263d; }
  #btns #launch { font-size: 9px; color: #ffe27a; }
</style>
</head>
<body>

<h1>ELEMENTAL BREAK 2.0</h1>
<div id="wrap">
  <canvas id="c" width="192" height="180"></canvas>
  <div id="pad">
    <div id="drag">DRAG TO MOVE<br>TAP TO LAUNCH</div>
    <div id="btns">
      <button type="button" data-key="ArrowLeft" aria-label="Left">◀</button>
      <button type="button" data-key="ArrowUp" aria-label="Up">▲</button>
      <button type="button" data-key="ArrowDown" aria-label="Down">▼</button>
      <button type="button" data-key="ArrowRight" aria-label="Right">▶</button>
      <button type="button" id="launch" aria-label="Launch">LAUNCH</button>
    </div>
  </div>
</div>
<p id="hint">MOVE: MOUSE / TOUCH PAD / ← → ↑ ↓ (W S) &nbsp; LAUNCH: CLICK / SPACE<br>
EVERY LEVEL IS DIFFERENT. STEEL NEVER BREAKS. CATCH GOLD FOR A WIDE PADDLE.</p>

<script src="brick-palettes.js"></script>
<script>
(function () {
  'use strict';

  var BP = window.BrickPalettes;
  var PAL = BP.PALETTES;
  var BW = BP.W, BH = BP.H;             // logical brick size; drawn at scale s

  var LW = 192, LH = 180;               // logical resolution
  var GAP_X = 1, GAP_Y = 1;
  var BRICK_Y0 = 30;                    // top of the brick field
  var BRICK_BOTTOM = 112;               // bricks never go below this

  var PADDLE_W = 32, PADDLE_WIDE = 48, PADDLE_H = 4;
  var PADDLE_BASE_Y = LH - 14;          // resting height of the paddle
  var PADDLE_TOP_Y = PADDLE_BASE_Y - 30; // highest the paddle can rise
  var PADDLE_COLOR = { face: '#8d8fa0', hi: '#c8cad6', lo: '#4c4e5c', edge: '#22232b' };
  var BASE_SPEED = 96;                  // logical px per second, level 1
  var BALL_R = 2;
  var TAU = Math.PI * 2;
  var COMBO_WINDOW = 1.2;               // seconds between breaks to keep a combo
  var INTRO_T = 1.8, CLEAR_T = 2.0;
  var PICKUP_CHANCE = 0.12, WIDE_TIME = 8;

  // Ball colour climbs through these stops as it bounces.
  var BOUNCE_STOPS = ['#ffffff', '#ffe27a', '#ff9a2a', '#ff3a6d', '#c040ff'];
  var BOUNCE_FULL = 60;                 // bounces to reach the last stop

  // ---------- Brick size and grid ----------
  // Bricks start at 2x and shrink to 1x from level 4. Whole-number scales keep pixels crisp.
  function scaleFor(n) { return n <= 3 ? 2 : 1; }
  function cellWFor(s) { return BW * s + GAP_X; }
  function cellHFor(s) { return BH * s + GAP_Y; }
  function colsFor(s) { return Math.floor((LW + GAP_X) / cellWFor(s)); }
  function maxRowsFor(s) { return Math.floor((BRICK_BOTTOM - BRICK_Y0 + GAP_Y) / cellHFor(s)); }

  // ---------- Procedural level generation ----------
  // A grid is an array of rows, each a boolean array of columns. true = brick here.
  function makeGrid(C, R, fn) {
    var out = [];
    for (var r = 0; r < R; r++) {
      var row = [];
      for (var c = 0; c < C; c++) row.push(!!fn(r, c));
      out.push(row);
    }
    return out;
  }

  // Random values, optionally mirrored left to right so the level is symmetric.
  function noiseGrid(C, R, mirror) {
    var out = [];
    for (var r = 0; r < R; r++) {
      var row = [];
      for (var c = 0; c < C; c++) row.push(Math.random());
      if (mirror) for (var c2 = 0; c2 < C; c2++) if (c2 > (C - 1) / 2) row[c2] = row[C - 1 - c2];
      out.push(row);
    }
    return out;
  }

  var FAMILIES = [
    { name: 'SCATTER', make: function (C, R) {
        var d = 0.55 + Math.random() * 0.25, rnd = noiseGrid(C, R, true);
        return makeGrid(C, R, function (r, c) { return rnd[r][c] < d; });
    } },
    { name: 'CHECKER', make: function (C, R) {
        return makeGrid(C, R, function (r, c) {
          return (r + c) % 2 === 0 ? Math.random() < 0.95 : Math.random() < 0.25;
        });
    } },
    { name: 'DIAMOND', make: function (C, R) {
        var cx = (C - 1) / 2, cy = (R - 1) / 2, s = 0.9 + Math.random() * 0.2;
        return makeGrid(C, R, function (r, c) {
          return Math.abs(c - cx) / (C / 2 + 0.5) + Math.abs(r - cy) / (R / 2 + 0.5) <= s;
        });
    } },
    { name: 'RING', make: function (C, R) {
        var cx = (C - 1) / 2, cy = (R - 1) / 2;
        var inner = 0.35 + Math.random() * 0.25, outer = 0.9 + Math.random() * 0.2;
        return makeGrid(C, R, function (r, c) {
          var d = Math.sqrt(Math.pow((c - cx) / (C / 2), 2) + Math.pow((r - cy) / (R / 2), 2));
          return d > inner && d <= outer;
        });
    } },
    { name: 'WAVE', make: function (C, R) {
        var f = 0.6 + Math.random() * 0.8, ph = Math.random() * TAU, mid = (R - 1) / 2;
        return makeGrid(C, R, function (r, c) {
          var w = mid + Math.sin(c * f + ph) * (R / 3);
          return Math.abs(r - w) < 0.9 || (Math.abs(r - (w + 2.2)) < 0.6 && Math.random() > 0.4);
        });
    } },
    { name: 'PYRAMID', make: function (C, R) {
        var cx = (C - 1) / 2, k = (C / 2) / R * 1.1;
        return makeGrid(C, R, function (r, c) { return Math.abs(c - cx) <= (r + 0.6) * k; });
    } },
    { name: 'STRIPES', make: function (C, R) {
        var par = Math.random() < 0.5 ? 0 : 1;
        return makeGrid(C, R, function (r, c) {
          return (r % 2 === par) ? Math.random() < 0.92 : Math.random() < 0.1;
        });
    } },
    { name: 'GATE', make: function (C, R) {
        var cx = (C - 1) / 2, gap = Math.random() < 0.5 ? 0.5 : 1.0;
        return makeGrid(C, R, function (r, c) {
          if (Math.abs(c - cx) <= gap) return r === R - 1 && Math.random() < 0.5;
          return Math.random() < 0.85;
        });
    } },
    { name: 'COLUMNS', make: function (C, R) {
        return makeGrid(C, R, function (r, c) {
          return c % 2 === 0 ? Math.random() < 0.9 : Math.random() < 0.2;
        });
    } },
    { name: 'CAVERN', make: function (C, R) {
        // Random fill, then smoothing passes make organic caves
        var g = makeGrid(C, R, function () { return Math.random() < 0.6; });
        for (var it = 0; it < 3; it++) {
          var ng = [];
          for (var r = 0; r < R; r++) {
            var row = [];
            for (var c = 0; c < C; c++) {
              var n = 0;
              for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                var rr = r + dr, cc = c + dc;
                if (rr >= 0 && rr < R && cc >= 0 && cc < C && g[rr][cc]) n++;
              }
              row.push(n >= 5);
            }
            ng.push(row);
          }
          g = ng;
        }
        return g;
    } },
    { name: 'INVADERS', make: function (C, R) {
        var rnd = noiseGrid(C, R, true);
        return makeGrid(C, R, function (r, c) {
          return (r % 2 === 0) ? rnd[r][c] < 0.7 : rnd[r][c] < 0.35;
        });
    } },
    { name: 'CROSS', make: function (C, R) {
        var cx = (C - 1) / 2, cy = (R - 1) / 2;
        return makeGrid(C, R, function (r, c) {
          return (Math.abs(c - cx) <= 0.8 || Math.abs(r - cy) <= 0.8) ? Math.random() < 0.95 : false;
        });
    } }
  ];

  function countFilled(grid) {
    var n = 0;
    for (var r = 0; r < grid.length; r++) for (var c = 0; c < grid[r].length; c++) if (grid[r][c]) n++;
    return n;
  }

  // Build a level for level n at brick scale s. Difficulty rises with n:
  // more rows, more hard bricks, and steel shows up from level 2.
  function generateLevel(n, s) {
    var C = colsFor(s), maxR = maxRowsFor(s);
    var R = Math.min(maxR, 2 + Math.floor((n + 1) / 2));
    var fam, grid, tries = 0;
    do {
      fam = FAMILIES[Math.floor(Math.random() * FAMILIES.length)];
      grid = fam.make(C, R);
      tries++;
    } while (countFilled(grid) < Math.max(6, C * R * 0.4) && tries < 20);

    var pSteel = Math.min(0.14, 0.015 * (n - 1));
    var pHard = Math.min(0.5, 0.06 + 0.03 * n);
    var rows = [];
    for (var r = 0; r < R; r++) {
      var str = '';
      for (var c = 0; c < C; c++) {
        if (!grid[r][c]) { str += '.'; continue; }
        var u = Math.random();
        if (u < pSteel) str += 'S';
        else if (u < pSteel + pHard) str += 'H';
        else str += String((r + (Math.random() < 0.25 ? 1 : 0)) % 8);
      }
      rows.push(str);
    }
    return { name: fam.name, cols: C, rows: rows };
  }

  // ---------- Audio: synthesised with Web Audio, no sound files ----------
  var AC = null, MASTER = null;
  var PAN = 0;                          // stereo position for the next sounds, -1..1

  function audio() {
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        MASTER = AC.createGain();
        MASTER.gain.value = 0.35;
        MASTER.connect(AC.destination);
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }

  // Output node for a sound: a stereo panner at PAN when supported.
  function outNode(ac) {
    if (!ac.createStereoPanner || PAN === 0) return MASTER;
    var p = ac.createStereoPanner();
    p.pan.value = PAN;
    p.connect(MASTER);
    return p;
  }

  function tone(f, dur, type, vol, slideTo, delay) {
    var ac = audio(); if (!ac) return;
    var t0 = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(), gn = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gn.gain.setValueAtTime(vol, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(outNode(ac));
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function noise(dur, vol, ftype, f0, f1, q, delay) {
    var ac = audio(); if (!ac) return;
    var t0 = ac.currentTime + (delay || 0);
    var len = Math.max(1, Math.floor(ac.sampleRate * dur));
    var buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = ac.createBufferSource(); src.buffer = buf;
    var flt = ac.createBiquadFilter();
    flt.type = ftype || 'bandpass';
    flt.frequency.setValueAtTime(f0, t0);
    if (f1) flt.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    flt.Q.value = q || 1;
    var gn = ac.createGain();
    gn.gain.setValueAtTime(vol, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(gn); gn.connect(outNode(ac));
    src.start(t0); src.stop(t0 + dur + 0.05);
  }

  // Pitch rises as the ball gets hotter, so long rallies sing higher.
  function pitchMul() {
    return 1 + Math.min(ball.bounces, BOUNCE_FULL) / BOUNCE_FULL * 0.6;
  }

  function panFor(x) {
    return Math.max(-0.8, Math.min(0.8, (x / LW) * 2 - 1));
  }

  function sfxWall(x) {
    var m = pitchMul();
    PAN = panFor(x);
    tone(1600 * m, 0.035, 'square', 0.05, 900 * m);
    noise(0.02, 0.09, 'highpass', 5000, 5000, 1);
    PAN = 0;
  }

  function sfxPaddle(hit) {
    var m = pitchMul();
    var f = 380 * m * (1 + hit * 0.25);   // hitting the paddle's edge raises the note
    PAN = panFor(ball.x);
    tone(f, 0.16, 'triangle', 0.3, f * 1.6);
    tone(f * 2.01, 0.1, 'sine', 0.1, null, 0.01);
    noise(0.03, 0.15, 'bandpass', 3000, 1500, 2);
    PAN = 0;
  }

  // Hard brick: a glassy tink on each hit that doesn't break it.
  function sfxTink(x) {
    var m = pitchMul();
    PAN = panFor(x);
    tone(1250 * m, 0.07, 'triangle', 0.2, 900 * m);
    noise(0.02, 0.1, 'highpass', 7000, 7000, 1);
    PAN = 0;
  }

  // Steel: a heavy metallic clank.
  function sfxClank(x) {
    var m = pitchMul();
    PAN = panFor(x);
    tone(880 * m, 0.14, 'square', 0.08, 600 * m);
    tone(1320 * m, 0.1, 'triangle', 0.06, null, 0.01);
    noise(0.03, 0.22, 'bandpass', 2500, 1200, 2);
    PAN = 0;
  }

  // One break sound per element. p is a small random pitch factor per break.
  var SOUNDS = {
    ember: function (p) {                       // crackle and a falling thump
      noise(0.22, 0.5, 'bandpass', 2400 * p, 500 * p, 0.9);
      tone(280 * p, 0.3, 'triangle', 0.22, 85 * p);
      noise(0.05, 0.25, 'highpass', 4000, 3000, 1, 0.06);
      noise(0.05, 0.2, 'highpass', 4000, 3000, 1, 0.12);
    },
    wave: function (p) {                        // rising bloop and a splash
      tone(520 * p, 0.14, 'sine', 0.28, 1400 * p);
      tone(980 * p, 0.12, 'sine', 0.2, 1900 * p, 0.06);
      noise(0.16, 0.12, 'bandpass', 3200, 900, 2);
    },
    bubble: function (p) {                      // wet pop
      tone(460 * p, 0.09, 'sine', 0.32, 120 * p);
      tone(760 * p, 0.2, 'sine', 0.2, 260 * p, 0.05);
    },
    thunder: function (p) {                     // electric crack and a zap
      noise(0.14, 0.9, 'highpass', 2500, 600, 0.5);
      tone(1800 * p, 0.2, 'square', 0.1, 220 * p);
      tone(70 * p, 0.28, 'sine', 0.35, 34 * p, 0.02);
    },
    glacier: function (p) {                     // glass chime
      tone(2093 * p, 0.5, 'sine', 0.18);
      tone(2794 * p, 0.6, 'sine', 0.12, null, 0.05);
      tone(3520 * p, 0.7, 'sine', 0.07, null, 0.1);
    },
    gale: function (p) {                        // whoosh
      noise(0.5, 0.45, 'bandpass', 350 * p, 2600 * p, 1.4);
      tone(1200 * p, 0.25, 'sine', 0.05, 2000 * p, 0.05);
    },
    terra: function (p) {                       // rock crunch and a deep thud
      noise(0.24, 0.75, 'lowpass', 900 * p, 150, 1);
      tone(110 * p, 0.26, 'sine', 0.42, 45 * p);
      noise(0.12, 0.4, 'bandpass', 1800, 600, 3, 0.02);
    },
    void: function (p) {                        // sub drop and a shimmer
      tone(70 * p, 0.6, 'sine', 0.5, 28 * p);
      tone(880 * p, 0.5, 'sine', 0.08, 1320 * p, 0.05);
      tone(1320 * p, 0.4, 'triangle', 0.05, 660 * p, 0.1);
    }
  };

  function sfxBreak(fx, x, mul) {
    var fn = SOUNDS[fx];
    PAN = panFor(x);
    if (fn) fn((0.94 + Math.random() * 0.12) * mul);
    noise(0.04, 0.2, 'highpass', 6000, 3000, 1);   // shared crunch layer
    PAN = 0;
  }

  function sfxLaunch() {
    tone(300, 0.25, 'triangle', 0.2, 900);
    noise(0.25, 0.15, 'bandpass', 500, 2500, 1);
  }

  function sfxIntro() {
    tone(330, 0.15, 'triangle', 0.18);
    tone(440, 0.2, 'triangle', 0.18, null, 0.12);
    tone(660, 0.25, 'triangle', 0.16, null, 0.24);
  }

  function sfxLoss() {
    tone(440, 0.7, 'sawtooth', 0.12, 70);
    tone(330, 0.7, 'triangle', 0.15, 55, 0.1);
  }

  function sfxOver() {
    tone(220, 1.2, 'triangle', 0.2, 55);
    tone(261.6, 1.2, 'triangle', 0.12, 65, 0.15);
  }

  function sfxClear() {
    var notes = [523, 659, 784, 1047];
    for (var i = 0; i < notes.length; i++) tone(notes[i], 0.22, 'triangle', 0.2, null, i * 0.09);
  }

  function sfxPower() {
    tone(523, 0.1, 'square', 0.12);
    tone(784, 0.1, 'square', 0.12, null, 0.08);
    tone(1046, 0.18, 'square', 0.12, null, 0.16);
  }

  // ---------- Game state ----------
  var cv = document.getElementById('c');
  var g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;

  var state, bricks, ball, paddle, lives, score, time, particles, keys, pointerX;
  var trail, flash, paddleFlash, recoil, shake, combo, lastBreak, comboColor;
  var level, stateT, curSpeed, pickups, paddleDY, levelName, padDX, padDY;

  function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }

  function ballColor(bounces) {
    var t = Math.min(bounces / BOUNCE_FULL, 1) * (BOUNCE_STOPS.length - 1);
    var i = Math.min(Math.floor(t), BOUNCE_STOPS.length - 2);
    var f = t - i;
    var a = hexToRgb(BOUNCE_STOPS[i]), b = hexToRgb(BOUNCE_STOPS[i + 1]);
    var r = Math.round(a[0] + (b[0] - a[0]) * f);
    var gg = Math.round(a[1] + (b[1] - a[1]) * f);
    var bb = Math.round(a[2] + (b[2] - a[2]) * f);
    return 'rgb(' + r + ',' + gg + ',' + bb + ')';
  }

  function newBall() {
    return { x: paddle.x + paddle.w / 2, y: paddle.y - BALL_R - 1, vx: 0, vy: 0, bounces: 0 };
  }

  function attachBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - BALL_R - 1;
    ball.vx = 0; ball.vy = 0;
  }

  // Generate and lay out level n. Every brick knows its own scale, width and height.
  function loadLevel(n) {
    var s = scaleFor(n);
    var lv = generateLevel(n, s);
    var cellW = cellWFor(s), cellH = cellHFor(s);
    var x0 = Math.floor((LW - (lv.cols * cellW - GAP_X)) / 2);
    levelName = lv.name;
    bricks = [];
    for (var r = 0; r < lv.rows.length; r++) {
      var row = lv.rows[r];
      for (var c = 0; c < lv.cols; c++) {
        var ch = row.charAt(c);
        if (ch === '.' || ch === '') continue;
        var k = {
          x: x0 + c * cellW,
          y: BRICK_Y0 + r * cellH,
          s: s, w: BW * s, h: BH * s,
          alive: true, type: 'n', hp: 1, maxHp: 1, flash: 0,
          seed: r * 17 + c + n * 97,
          pal: PAL[(r + c) % PAL.length]
        };
        if (ch === 'S') {
          k.type = 's';
        } else if (ch === 'H') {
          k.type = 'h'; k.hp = 2; k.maxHp = 2;
          k.pal = PAL[(r * 3 + c) % PAL.length];
        } else {
          k.pal = PAL[parseInt(ch, 10) % PAL.length];
        }
        bricks.push(k);
      }
    }
    // Each level is a little faster than the one before, capped at 1.8x
    curSpeed = Math.min(BASE_SPEED * (1 + 0.06 * (n - 1)), BASE_SPEED * 1.8);
  }

  function setPaddleWidth(w) {
    var centre = paddle.x + paddle.w / 2;
    paddle.w = w;
    paddle.x = Math.max(0, Math.min(LW - w, centre - w / 2));
  }

  function reset(full) {
    paddle = { x: LW / 2 - PADDLE_W / 2, w: PADDLE_W, y: PADDLE_BASE_Y, wideT: 0 };
    ball = newBall();
    particles = [];
    pickups = [];
    trail = [];
    flash = { L: 0, R: 0, T: 0 };
    paddleFlash = 0;
    recoil = 0;
    shake = 0;
    combo = 0;
    lastBreak = -10;
    if (full) {
      level = 1;
      lives = 3;
      score = 0;
      loadLevel(1);
      state = 'intro';
      stateT = INTRO_T;
      sfxIntro();
    } else {
      state = 'ready';
    }
  }

  function launch() {
    audio();                              // unlocks sound on the first user gesture
    if (state !== 'ready') return;
    var ang = (Math.random() * 0.6 - 0.3);            // slight random start angle
    ball.vx = Math.sin(ang) * curSpeed;
    ball.vy = -Math.cos(ang) * curSpeed;
    state = 'play';
    sfxLaunch();
  }

  function bounce() {
    ball.bounces++;
  }

  // ---------- Particles ----------
  // Per-element destruction: how the pixel chunks fly and which sparks appear.
  //   g: gravity (negative rises), drag: air resistance per 1/60 s,
  //   spread: outward speed, kinds: chunk looks, pull: implode toward centre
  var SHATTER = {
    ember:   { g: -30,  drag: 0.97, life: [0.8, 1.3], spread: 60,  kinds: ['px'],     sparks: 'ember' },
    wave:    { g: 140,  drag: 0.99, life: [0.9, 1.4], spread: 70,  kinds: ['px'],     sparks: 'splash' },
    bubble:  { g: -35,  drag: 0.98, life: [1.0, 1.6], spread: 45,  kinds: ['bubble'], sparks: 'bubble' },
    thunder: { g: 60,   drag: 0.95, life: [0.35, 0.6], spread: 160, kinds: ['px'],    sparks: 'zap' },
    glacier: { g: 110,  drag: 0.99, life: [1.0, 1.5], spread: 55,  kinds: ['shard'],  sparks: 'glint' },
    gale:    { g: -8,   drag: 0.985, life: [0.6, 0.9], spread: 50, kinds: ['streak'], sparks: 'wind', windX: true },
    terra:   { g: 280,  drag: 0.99, life: [0.8, 1.2], spread: 80,  kinds: ['px'],     sparks: 'dust' },
    void:    { g: 0,    drag: 0.99, life: [0.9, 1.2], spread: 0,   kinds: ['px'],     sparks: 'ring', pull: true }
  };

  function pushParticle(q) {
    if (particles.length > 1500) particles.splice(0, particles.length - 1400);
    particles.push(q);
  }

  function spark(x, y, vx, vy, g, drag, life, color, kind) {
    pushParticle({
      x: x, y: y, vx: vx, vy: vy, g: g, drag: drag,
      life: life, max: life, color: color, kind: kind,
      pull: 0, cx: x, cy: y, wob: Math.random() * TAU
    });
  }

  function ringAt(x, y, color, life) {
    pushParticle({
      x: x, y: y, vx: 0, vy: 0, g: 0, drag: 1, life: life, max: life,
      color: color, kind: 'ring', pull: 0, cx: x, cy: y, wob: 0
    });
  }

  // Small burst of pixels when the ball hits a wall, paddle or brick.
  // nx, ny is the surface normal, so the sparks fly away from the surface.
  function impactSparks(x, y, nx, ny, n, color) {
    var col = color || ballColor(ball.bounces);
    for (var i = 0; i < n; i++) {
      var s = 40 + Math.random() * 60;
      spark(x, y, (nx + (Math.random() - 0.5) * 1.2) * s, (ny + (Math.random() - 0.5) * 1.2) * s,
            120, 0.9, 0.2 + Math.random() * 0.15, col, 'px');
    }
  }

  // Each pixel of the brick becomes a chunk that flies out from the impact point.
  function shatter(k, hx, hy) {
    var pal = k.pal;
    var prof = SHATTER[pal.fx] || SHATTER.ember;
    var cx = k.x + k.w / 2, cy = k.y + k.h / 2;
    var windDir = ball.vx >= 0 ? 1 : -1;

    ringAt(hx, hy, pal.tones[4], 0.25);

    for (var y = 0; y < BH; y++) {
      for (var x = 0; x < BW; x++) {
        var idx = BP.tileIndex(x, y, k.seed);
        if (idx < 0) continue;
        var px = k.x + (x + 0.5) * k.s, py = k.y + (y + 0.5) * k.s;
        var dx = px - hx, dy = py - hy, d = Math.hypot(dx, dy) || 1;
        var sp = prof.spread * (0.5 + Math.random() * 0.8);
        var vx = (dx / d) * sp + (Math.random() - 0.5) * 30;
        var vy = (dy / d) * sp + (Math.random() - 0.5) * 30;
        if (prof.windX) vx += windDir * 90;
        if (prof.pull) {
          vx = (cx - px) * 2.2 + (Math.random() - 0.5) * 20;
          vy = (cy - py) * 2.2 + (Math.random() - 0.5) * 20;
        }
        var col = pal.tones[idx];
        if (idx === 2 && Math.random() < 0.3) col = pal.tones[3];
        var life = prof.life[0] + Math.random() * (prof.life[1] - prof.life[0]);
        pushParticle({
          x: px, y: py, vx: vx, vy: vy, g: prof.g, drag: prof.drag,
          life: life, max: life, color: col,
          kind: prof.kinds[(Math.random() * prof.kinds.length) | 0],
          pull: prof.pull ? 5 : 0, cx: cx, cy: cy, wob: Math.random() * TAU
        });
      }
    }
    spawnSparks(prof.sparks, pal, cx, cy, hx, hy, windDir);
  }

  // Secondary sparks that match each element.
  function spawnSparks(type, pal, cx, cy, hx, hy, windDir) {
    var t = pal.tones, i, a, s;
    if (type === 'ember') {
      for (i = 0; i < 8; i++)
        spark(hx + (Math.random() - 0.5) * 12, hy, (Math.random() - 0.5) * 40, -40 - Math.random() * 60,
              -50, 0.96, 0.6 + Math.random() * 0.4, Math.random() < 0.5 ? t[3] : t[4], 'px');
    } else if (type === 'splash') {
      for (i = 0; i < 10; i++)
        spark(hx, hy, (Math.random() - 0.5) * 120, -90 - Math.random() * 80,
              320, 0.99, 0.7, Math.random() < 0.5 ? t[2] : t[3], 'px');
    } else if (type === 'bubble') {
      for (i = 0; i < 4; i++)
        spark(cx + (Math.random() - 0.5) * 10, cy + (Math.random() - 0.5) * 4, 0, -15 - Math.random() * 20,
              -10, 1, 1.1 + Math.random() * 0.5, Math.random() < 0.5 ? t[2] : t[4], 'bubble');
    } else if (type === 'zap') {
      for (i = 0; i < 12; i++) {
        a = (i / 12) * TAU + Math.random() * 0.3;
        s = 140 + Math.random() * 90;
        spark(hx, hy, Math.cos(a) * s, Math.sin(a) * s, 0, 0.88, 0.22 + Math.random() * 0.15, t[4], 'streak');
      }
    } else if (type === 'glint') {
      for (i = 0; i < 4; i++) {
        a = (i / 4) * TAU;
        spark(hx, hy, Math.cos(a) * 25, Math.sin(a) * 25, 0, 0.85, 0.35, t[4], 'glint');
      }
    } else if (type === 'wind') {
      for (i = 0; i < 6; i++)
        spark(hx + (Math.random() - 0.5) * 6, hy + (Math.random() - 0.5) * 8,
              windDir * (120 + Math.random() * 120), (Math.random() - 0.5) * 30,
              0, 0.97, 0.45 + Math.random() * 0.3, Math.random() < 0.5 ? t[2] : t[3], 'streak');
    } else if (type === 'dust') {
      for (i = 0; i < 6; i++)
        spark(cx + (Math.random() - 0.5) * 10, cy, (Math.random() - 0.5) * 30, -10 - Math.random() * 15,
              -6, 0.9, 0.6 + Math.random() * 0.4, t[1], 'puff');
    } else if (type === 'ring') {
      for (i = 0; i < 16; i++) {
        a = (i / 16) * TAU;
        spark(cx, cy, Math.cos(a) * 110, Math.sin(a) * 110, 0, 0.9, 0.4, t[3], 'px');
      }
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.life -= dt;
      if (q.life <= 0) { particles.splice(i, 1); continue; }
      if (q.pull) {
        q.vx += (q.cx - q.x) * q.pull * dt;
        q.vy += (q.cy - q.y) * q.pull * dt;
      }
      q.vy += q.g * dt;
      var dr = Math.pow(q.drag, dt * 60);
      q.vx *= dr; q.vy *= dr;
      if (q.kind === 'bubble') q.vx = Math.sin(time * 5 + q.wob) * 8;   // bubbles wobble
      q.x += q.vx * dt;
      q.y += q.vy * dt;
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      var a = Math.max(0, q.life / q.max);
      var x = Math.round(q.x), y = Math.round(q.y);
      g.globalAlpha = Math.min(1, a * 1.6);
      g.fillStyle = q.color;
      if (q.kind === 'bubble') {
        g.fillRect(x, y, 2, 2);
      } else if (q.kind === 'shard') {
        if (Math.sin(q.wob + q.life * 12) > 0) { g.fillRect(x, y, 1, 1); g.fillRect(x + 1, y + 1, 1, 1); }
        else g.fillRect(x, y, 2, 1);
      } else if (q.kind === 'streak') {
        g.fillRect(q.vx >= 0 ? x - 2 : x, y, 3, 1);
      } else if (q.kind === 'glint') {
        g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3);
      } else if (q.kind === 'puff') {
        g.globalAlpha *= 0.5; g.fillRect(x, y, 2, 2);
      } else if (q.kind === 'ring') {
        var r = Math.round((1 - a) * 9) + 1;
        g.fillRect(x - r, y - r, 2 * r + 1, 1);
        g.fillRect(x - r, y + r, 2 * r + 1, 1);
        g.fillRect(x - r, y - r, 1, 2 * r + 1);
        g.fillRect(x + r, y - r, 1, 2 * r + 1);
      } else {
        g.fillRect(x, y, 1, 1);
      }
    }
    g.globalAlpha = 1;
  }

  // ---------- Power-ups ----------
  function spawnPickup(x, y) {
    pickups.push({ x: x, y: y, vy: 38, t: 0 });
  }

  function updatePickups(dt) {
    for (var i = pickups.length - 1; i >= 0; i--) {
      var p = pickups[i];
      p.y += p.vy * dt;
      p.t += dt;
      if (p.y > LH) { pickups.splice(i, 1); continue; }
      if (p.y + 4 >= paddle.y && p.y <= paddle.y + PADDLE_H &&
          p.x + 6 >= paddle.x && p.x <= paddle.x + paddle.w) {
        setPaddleWidth(PADDLE_WIDE);
        paddle.wideT = WIDE_TIME;
        impactSparks(p.x + 3, paddle.y, 0, -1, 8, '#ffe27a');
        sfxPower();
        pickups.splice(i, 1);
      }
    }
  }

  function drawPickups() {
    for (var i = 0; i < pickups.length; i++) {
      var p = pickups[i];
      var x = Math.round(p.x), y = Math.round(p.y);
      g.fillStyle = '#ff9a2a'; g.fillRect(x, y, 6, 4);
      g.fillStyle = (Math.floor(p.t * 8) % 2) ? '#ff3a6d' : '#ffe27a';
      g.fillRect(x + 1, y + 1, 4, 2);
    }
  }

  // ---------- Hits ----------
  function wallHit(side) {
    bounce();
    flash[side] = 0.14;
    var nx = side === 'L' ? 1 : side === 'R' ? -1 : 0;
    var ny = side === 'T' ? 1 : 0;
    sfxWall(ball.x);
    impactSparks(ball.x, ball.y, nx, ny, 3);
  }

  function paddleHit(hit) {
    bounce();
    paddleFlash = 0.14;
    recoil = 0.06;
    sfxPaddle(hit);
    impactSparks(ball.x, ball.y, 0, -1, 5);
  }

  function brickHit(k, px, py) {
    // Reflect on the axis we entered through, and push the ball out of the brick
    var wasInX = px + BALL_R > k.x && px - BALL_R < k.x + k.w;
    if (wasInX) { ball.vy = -ball.vy; ball.y = py; }
    else        { ball.vx = -ball.vx; ball.x = px; }
    bounce();

    var nx = wasInX ? 0 : (ball.vx > 0 ? 1 : -1);
    var ny = wasInX ? (ball.vy > 0 ? 1 : -1) : 0;

    // Steel: indestructible
    if (k.type === 's') {
      k.flash = 0.08;
      shake = Math.min(1, shake + 0.15);
      sfxClank(k.x + k.w / 2);
      impactSparks(ball.x, ball.y, nx, ny, 3, '#c8cad6');
      return;
    }

    // Hard brick: takes a hit and cracks
    if (k.type === 'h' && k.hp > 1) {
      k.hp--;
      k.flash = 0.1;
      shake = Math.min(1, shake + 0.2);
      sfxTink(k.x + k.w / 2);
      ringAt(ball.x, ball.y, k.pal.tones[3], 0.18);
      impactSparks(ball.x, ball.y, nx, ny, 3);
      return;
    }

    // Break it
    k.alive = false;
    var now = time;
    combo = (now - lastBreak < COMBO_WINDOW) ? combo + 1 : 1;
    lastBreak = now;
    comboColor = k.pal.tones[4];
    score += 10 * combo;

    shatter(k, ball.x, ball.y);
    var ladder = Math.pow(2, Math.min(combo - 1, 12) / 6);   // up a semitone per 2 combo hits
    sfxBreak(k.pal.fx, k.x + k.w / 2, pitchMul() * ladder);
    if (combo >= 3) tone(1568 * ladder, 0.15, 'sine', 0.12, null, 0.05);
    shake = Math.min(1, shake + 0.35);
    if (Math.random() < PICKUP_CHANCE) spawnPickup(k.x + k.w / 2 - 3, k.y + k.h / 2 - 2);
  }

  // ---------- Main update ----------
  function levelCleared() {
    for (var i = 0; i < bricks.length; i++) {
      if (bricks[i].type !== 's' && bricks[i].alive) return false;
    }
    return true;
  }

  function step(dt) {
    time += dt;

    // Decay visual timers
    flash.L = Math.max(0, flash.L - dt);
    flash.R = Math.max(0, flash.R - dt);
    flash.T = Math.max(0, flash.T - dt);
    paddleFlash = Math.max(0, paddleFlash - dt);
    recoil = Math.max(0, recoil - dt);
    shake = Math.max(0, shake - dt * 3);
    for (var b = 0; b < bricks.length; b++) bricks[b].flash = Math.max(0, bricks[b].flash - dt);

    // Paddle from keyboard and pointer: left/right and up/down
    var dir = (keys.ArrowLeft ? -1 : 0) + (keys.ArrowRight ? 1 : 0);
    if (dir !== 0) paddle.x += dir * 140 * dt;
    if (pointerX !== null) paddle.x = pointerX - paddle.w / 2;
    paddle.x += padDX;                    // touch pad drag, in logical pixels
    padDX = 0;
    paddle.x = Math.max(0, Math.min(LW - paddle.w, paddle.x));

    var vdir = (keys.ArrowUp || keys.w || keys.W ? -1 : 0) + (keys.ArrowDown || keys.s || keys.S ? 1 : 0);
    if (vdir !== 0) paddle.y += vdir * 90 * dt;
    paddle.y += paddleDY + padDY;         // pointer and touch pad movement, in logical pixels
    paddleDY = 0;
    padDY = 0;
    paddle.y = Math.max(PADDLE_TOP_Y, Math.min(PADDLE_BASE_Y, paddle.y));

    // Wide paddle timer
    if (paddle.wideT > 0) {
      paddle.wideT -= dt;
      if (paddle.wideT <= 0) setPaddleWidth(PADDLE_W);
    }

    updateParticles(dt);
    updatePickups(dt);

    if (state === 'intro') {
      attachBall();
      stateT -= dt;
      if (stateT <= 0) state = 'ready';
      return;
    }
    if (state === 'clear') {
      attachBall();
      stateT -= dt;
      if (stateT <= 0) {
        level++;
        loadLevel(level);
        ball = newBall();
        pickups = [];
        state = 'intro';
        stateT = INTRO_T;
        sfxIntro();
      }
      return;
    }
    if (state === 'ready') {
      attachBall();
      trail.length = 0;
      return;
    }
    if (state !== 'play') return;

    var dist = curSpeed * dt;
    var n = Math.max(1, Math.ceil(dist / 0.5));
    var sub = dt / n;
    for (var i = 0; i < n; i++) {
      var px = ball.x, py = ball.y;
      ball.x += ball.vx * sub;
      ball.y += ball.vy * sub;
      collide(px, py);
      if (state !== 'play') return;
    }

    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 10) trail.shift();
  }

  function collide(px, py) {
    var r = BALL_R;

    // Walls
    if (ball.x - r < 0) { ball.x = r; ball.vx = Math.abs(ball.vx); wallHit('L'); }
    if (ball.x + r > LW) { ball.x = LW - r; ball.vx = -Math.abs(ball.vx); wallHit('R'); }
    if (ball.y - r < 0) { ball.y = r; ball.vy = Math.abs(ball.vy); wallHit('T'); }

    // Paddle: when moving down and crossing its top edge.
    // Also catches a paddle that rises onto the ball, so the ball can't slip through.
    if (ball.vy > 0 &&
        ball.y + r >= paddle.y &&
        (py + r <= paddle.y + 1 || ball.y + r <= paddle.y + PADDLE_H + 3) &&
        ball.x >= paddle.x - r && ball.x <= paddle.x + paddle.w + r) {
      var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      hit = Math.max(-1, Math.min(1, hit));
      var ang = hit * 1.0;                              // up to ~57 degrees
      var speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(ang) * speed;
      ball.vy = -Math.cos(ang) * speed;
      ball.y = paddle.y - r;
      paddleHit(hit);
    }

    // Bricks (steel included, so it bounces the ball)
    for (var b = 0; b < bricks.length; b++) {
      var k = bricks[b];
      if (!k.alive) continue;
      var cx = Math.max(k.x, Math.min(ball.x, k.x + k.w));
      var cy = Math.max(k.y, Math.min(ball.y, k.y + k.h));
      var dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > r * r) continue;
      brickHit(k, px, py);
      break;
    }

    if (levelCleared()) {
      state = 'clear';
      stateT = CLEAR_T;
      score += 100 * level;
      lives = Math.min(5, lives + 1);
      sfxClear();
      return;
    }

    // Floor: lose a life
    if (ball.y - r > LH) {
      lives--;
      sfxLoss();
      if (lives <= 0) { state = 'over'; sfxOver(); return; }
      reset(false);
    }
  }

  // ---------- Draw ----------
  // Fill a rectangle given in logical brick pixels, scaled to the brick's size.
  function rect(k, x, y, w, h, color) {
    g.fillStyle = color;
    g.fillRect(k.x + x * k.s, k.y + y * k.s, w * k.s, h * k.s);
  }

  function drawSteel(k) {
    rect(k, 0, 0, BW, BH, '#22232b');
    rect(k, 1, 1, BW - 2, BH - 2, '#5b5f70');
    rect(k, 1, 1, BW - 2, 1, '#9aa0b4');
    rect(k, 1, BH - 2, BW - 2, 1, '#373a48');
    rect(k, 4 + (k.seed % 5), 3, 5, 1, '#6d7286');
    rect(k, 2, 2, 1, 1, '#c8cad6'); rect(k, BW - 3, 2, 1, 1, '#c8cad6');   // rivets
    rect(k, 2, BH - 3, 1, 1, '#c8cad6'); rect(k, BW - 3, BH - 3, 1, 1, '#c8cad6');
    if (k.flash > 0) {
      g.globalAlpha = k.flash / 0.08 * 0.7;
      rect(k, 1, 1, BW - 2, BH - 2, '#ffffff');
      g.globalAlpha = 1;
    }
  }

  // Cracks on a damaged hard brick
  function drawCracks(k) {
    g.globalAlpha = 0.75;
    for (var y = 1; y < BH - 1; y++) {
      for (var x = 1; x < BW - 1; x++) {
        if ((x * 7 + y * 13 + k.seed) % 17 === 0 || (x * 3 + y * 5 + k.seed) % 23 === 0) {
          rect(k, x, y, 1, 1, '#07070d');
        }
      }
    }
    g.globalAlpha = 1;
  }

  function draw() {
    var ox = 0, oy = 0;
    if (shake > 0) {
      ox = Math.round((Math.random() - 0.5) * shake * 4);
      oy = Math.round((Math.random() - 0.5) * shake * 4);
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#07070d';
    g.fillRect(0, 0, LW, LH);
    g.setTransform(1, 0, 0, 1, ox, oy);

    // Bricks
    for (var b = 0; b < bricks.length; b++) {
      var k = bricks[b];
      if (!k.alive) continue;
      if (k.type === 's') { drawSteel(k); continue; }
      BP.drawBrick(g, k.pal, k.x, k.y, k.s, k.seed, time);
      if (k.hp < k.maxHp) drawCracks(k);
      if (k.flash > 0) {
        g.globalAlpha = k.flash / 0.1 * 0.6;
        g.fillStyle = '#ffffff';
        g.fillRect(k.x, k.y, k.w, k.h);
        g.globalAlpha = 1;
      }
    }

    drawPickups();
    drawParticles();

    var col = ballColor(ball.bounces);

    // Wall edge flashes in the ball's colour
    g.fillStyle = col;
    if (flash.L > 0) { g.globalAlpha = flash.L / 0.14; g.fillRect(0, 0, 1, LH); }
    if (flash.R > 0) { g.globalAlpha = flash.R / 0.14; g.fillRect(LW - 1, 0, 1, LH); }
    if (flash.T > 0) { g.globalAlpha = flash.T / 0.14; g.fillRect(0, 0, LW, 1); }
    g.globalAlpha = 1;

    // Paddle: grey pixel bevel, flashes in ball colour on hit, recoils, gloss shine
    var x = Math.round(paddle.x), y = paddle.y + (recoil > 0 ? 1 : 0);
    var pw = paddle.w;
    var face = paddleFlash > 0 ? col : PADDLE_COLOR.face;
    g.fillStyle = '#0b0b12'; g.fillRect(x + 1, y + PADDLE_H, pw - 2, 1);   // shadow
    g.fillStyle = PADDLE_COLOR.edge; g.fillRect(x, y, pw, PADDLE_H);
    g.fillStyle = face;              g.fillRect(x + 1, y + 1, pw - 2, PADDLE_H - 2);
    g.fillStyle = PADDLE_COLOR.hi;   g.fillRect(x + 1, y + 1, pw - 2, 1);
    g.fillStyle = PADDLE_COLOR.lo;   g.fillRect(x + 1, y + PADDLE_H - 2, pw - 2, 1);
    if (paddleFlash <= 0) {
      var shineX = x + 3 + Math.floor((time * 22) % (pw - 8));
      g.fillStyle = '#eef0f8';
      g.fillRect(shineX, y + 1, 2, 1);
    }
    if (paddle.wideT > 0 && paddle.wideT < 2 && Math.floor(time * 10) % 2) {
      g.fillStyle = '#ffe27a';                       // warns the wide paddle is ending
      g.fillRect(x, y - 1, pw, 1);
    }

    // Ball trail: fading ghost pixels
    for (var i = 0; i < trail.length; i++) {
      var tp = trail[i];
      g.globalAlpha = (i + 1) / (trail.length + 2) * 0.5;
      g.fillStyle = col;
      g.fillRect(Math.round(tp.x) - 1, Math.round(tp.y) - 1, 2, 2);
    }
    g.globalAlpha = 1;

    // Ball: 4x4 pixel blob, corners cut, colour from bounce count, with a highlight
    var bx = Math.round(ball.x - 2), by = Math.round(ball.y - 2);
    g.fillStyle = col;
    g.fillRect(bx + 1, by, 2, 4);
    g.fillRect(bx, by + 1, 4, 2);
    g.globalAlpha = 0.6;
    g.fillStyle = '#ffffff';
    g.fillRect(bx + 1, by + 1, 1, 1);
    g.globalAlpha = 1;

    // HUD
    g.fillStyle = '#8c8ca8';
    g.font = '8px monospace';
    g.textBaseline = 'top';
    g.textAlign = 'left';
    g.fillText('SCORE ' + score, 4, 4);
    g.textAlign = 'center';
    g.fillText('LV ' + level, LW / 2, 4);
    g.textAlign = 'right';
    g.fillText('LIVES ' + lives, LW - 4, 4);
    g.textAlign = 'left';
    g.fillStyle = col;
    g.fillText('BOUNCES ' + ball.bounces, 4, 14);
    if (combo >= 2 && time - lastBreak < COMBO_WINDOW + 0.4) {
      g.textAlign = 'right';
      g.fillStyle = comboColor;
      g.fillText('x' + combo + ' COMBO', LW - 4, 14);
    }

    // Overlays
    g.textAlign = 'center';
    g.fillStyle = '#ebebf5';
    if (state === 'intro') {
      g.fillText('LEVEL ' + level, LW / 2, 112);
      g.fillStyle = col;
      g.fillText(levelName, LW / 2, 124);
    }
    if (state === 'ready') g.fillText('CLICK / SPACE', LW / 2, 112);
    if (state === 'clear') {
      g.fillText('LEVEL CLEAR', LW / 2, 112);
      g.fillStyle = '#ffe27a';
      g.fillText('+' + (100 * level) + ' BONUS', LW / 2, 124);
    }
    if (state === 'over') {
      g.fillText('GAME OVER', LW / 2, 112);
      g.fillStyle = '#8c8ca8';
      g.fillText('SPACE TO RETRY', LW / 2, 124);
    }
    g.textAlign = 'left';

    g.setTransform(1, 0, 0, 1, 0, 0);
  }

  // ---------- Input ----------
  keys = {};
  window.addEventListener('keydown', function (e) {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) !== -1) { keys[e.key] = true; e.preventDefault(); }
    if (e.key === 'w' || e.key === 'W' || e.key === 's' || e.key === 'S') keys[e.key] = true;
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'over') reset(true); else launch();
    }
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  function toLogicalX(clientX) {
    var rect = cv.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * LW;
  }

  function toLogicalY(clientY) {
    var rect = cv.getBoundingClientRect();
    return (clientY - rect.top) / rect.height * LH;
  }

  pointerX = null;
  var lastPY = null;
  paddleDY = 0;
  cv.addEventListener('pointermove', function (e) {
    pointerX = toLogicalX(e.clientX);
    var py = toLogicalY(e.clientY);
    if (lastPY !== null) paddleDY += py - lastPY;
    lastPY = py;
  });
  cv.addEventListener('pointerleave', function () { pointerX = null; lastPY = null; });
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    pointerX = toLogicalX(e.clientX);
    lastPY = toLogicalY(e.clientY);
    if (state === 'over') reset(true); else launch();
  });

  // ---------- Touch pad (below the playfield) ----------
  padDX = 0;
  padDY = 0;

  function tapAction() {
    if (state === 'over') reset(true); else launch();
  }

  var drag = document.getElementById('drag');
  var padLast = null, padStart = null;
  var PAD_GAIN = 1.6;                    // how far the paddle moves per pad movement

  drag.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    audio();
    drag.setPointerCapture(e.pointerId);
    padLast = { x: e.clientX, y: e.clientY };
    padStart = { t: performance.now(), moved: 0 };
  });

  drag.addEventListener('pointermove', function (e) {
    if (!padLast) return;
    var rect = drag.getBoundingClientRect();
    var dx = e.clientX - padLast.x, dy = e.clientY - padLast.y;
    padLast = { x: e.clientX, y: e.clientY };
    padStart.moved += Math.abs(dx) + Math.abs(dy);
    padDX += dx / rect.width * LW * PAD_GAIN;
    padDY += dy / rect.height * LH * PAD_GAIN;
  });

  function padRelease() {
    if (!padStart) return;
    var quickTap = performance.now() - padStart.t < 300 && padStart.moved < 12;
    padStart = null;
    padLast = null;
    if (quickTap) tapAction();
  }

  drag.addEventListener('pointerup', padRelease);
  drag.addEventListener('pointercancel', function () { padStart = null; padLast = null; });

  // Arrow buttons hold the matching key down while pressed
  document.querySelectorAll('#btns button[data-key]').forEach(function (b) {
    var key = b.getAttribute('data-key');
    function press(e) { e.preventDefault(); audio(); keys[key] = true; b.classList.add('pressed'); }
    function release() { keys[key] = false; b.classList.remove('pressed'); }
    b.addEventListener('pointerdown', press);
    b.addEventListener('pointerup', release);
    b.addEventListener('pointerleave', release);
    b.addEventListener('pointercancel', release);
  });

  var launchBtn = document.getElementById('launch');
  launchBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    tapAction();
  });

  // ---------- Loop ----------
  time = 0;
  reset(true);
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    step(dt);
    draw();
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
